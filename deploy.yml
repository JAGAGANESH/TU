name: Deploy Engagement Mania

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Inject token into HTML
        run: |
          sed -i "s|YOUR_GITHUB_TOKEN_HERE|${{ secrets.SUBMISSIONS_TOKEN }}|g" engagement-mania.html

      - name: Verify injection & test token against GitHub API
        run: |
          if grep -q "YOUR_GITHUB_TOKEN_HERE" engagement-mania.html; then
            echo "❌ FAILED: Placeholder still present — secret name wrong"
            exit 1
          fi
          echo "✅ Placeholder replaced"

          # Extract injected token from HTML
          TOKEN=$(grep -oP "(?<=GITHUB_TOKEN  = ').*?(?=')" engagement-mania.html)
          echo "Token length: ${#TOKEN} chars"
          echo "Token prefix: ${TOKEN:0:4}"

          # Live test against GitHub API
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)
          echo "GitHub API response: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Token is VALID"
          elif [ "$RESPONSE" = "401" ]; then
            echo "❌ Token is INVALID (401) — token value is wrong or corrupted"
            exit 1
          elif [ "$RESPONSE" = "403" ]; then
            echo "❌ Token FORBIDDEN (403) — token exists but missing repo scope"
            exit 1
          else
            echo "❌ Unexpected response: $RESPONSE"
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          token: ${{ secrets.GITHUB_TOKEN }}
          clean: true
