<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engagement Mania 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .welcome-screen {
            animation: fadeIn 0.8s ease;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .welcome-subtitle {
            font-size: 48px;
            margin-bottom: 50px;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .header {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .question {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 500;
        }

        .input-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .char-input {
            width: 40px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            border: none;
            border-bottom: 3px solid #ddd;
            background: transparent;
            color: #333;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .char-input:focus {
            outline: none;
            border-bottom-color: #667eea;
            transform: scale(1.1);
        }

        .char-input.filled {
            border-bottom-color: #667eea;
        }

        .char-input.correct {
            border-bottom-color: #4caf50;
            color: #4caf50;
        }

        .char-input.incorrect {
            border-bottom-color: #f44336;
            color: #f44336;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            opacity: 0.5;
            pointer-events: none;
        }

        .next-btn.enabled {
            opacity: 1;
            pointer-events: all;
        }

        .next-btn.enabled:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .next-btn.enabled:active {
            transform: translateY(0);
        }

        .feedback {
            margin-top: 20px;
            font-size: 16px;
            min-height: 24px;
            font-weight: 500;
        }

        .feedback.success {
            color: #4caf50;
        }

        .feedback.error {
            color: #f44336;
        }

        .page-transition {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .access-denied {
            text-align: center;
        }

        .access-denied-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .access-denied-title {
            font-size: 28px;
            font-weight: 700;
            color: #f44336;
            margin-bottom: 20px;
        }

        .access-denied-message {
            font-size: 24px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- Content will be dynamically loaded here -->
    </div>

    <script>
        // Quiz data - questions mapped by key-answer pairs
        const quizData = {
            "TRANSUNION-START": {
                keyValue: "AB",
                question: "What is the capital of France?",
                answer: "PARIS",
                nextKey: "AB",
                nextAnswer: "PARIS"
            },
            "AB-PARIS": {
                keyValue: "CD",
                question: "What is 2 + 2?",
                answer: "FOUR",
                nextKey: "CD",
                nextAnswer: "FOUR"
            },
            "CD-FOUR": {
                keyValue: "EF",
                question: "What color is the sky?",
                answer: "BLUE",
                nextKey: "EF",
                nextAnswer: "BLUE"
            },
            "EF-BLUE": {
                keyValue: "GH",
                question: "How many days in a week?",
                answer: "SEVEN",
                nextKey: "GH",
                nextAnswer: "SEVEN"
            },
            "GH-SEVEN": {
                keyValue: "IJ",
                question: "What is the opposite of hot?",
                answer: "COLD",
                nextKey: null,
                nextAnswer: null
            }
        };

        let inputs = [];
        let currentQuestionData = null;

        // Function to get hash parameters
        function getHashParams() {
            const hash = window.location.hash.substring(1); // Remove the #
            if (!hash) return { key: null, answer: null };
            
            const params = hash.split('&');
            const result = {};
            params.forEach(param => {
                const [key, value] = param.split('=');
                result[key] = decodeURIComponent(value);
            });
            
            return {
                key: result.key || null,
                answer: result.answer || null
            };
        }

        // Function to show welcome screen
        function showWelcomeScreen() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-title">Welcome To<br>Engagement Mania 2026</div>
                    <div class="welcome-subtitle">🎮</div>
                    <button class="start-btn" onclick="startGame()">Start Game</button>
                </div>
            `;
        }

        // Function to start the game
        function startGame() {
            // Use hash navigation for local file compatibility
            window.location.hash = 'key=transunion&answer=start';
        }

        // Function to show access denied
        function showAccessDenied() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="page-transition access-denied">
                    <div class="access-denied-icon">🔒</div>
                    <div class="access-denied-title">Access Denied</div>
                    <div class="access-denied-message">Answer Please!!</div>
                </div>
            `;
        }

        // Function to load question
        function loadQuestion(questionData) {
            currentQuestionData = questionData;
            const container = document.getElementById('mainContainer');
            
            container.innerHTML = `
                <div class="page-transition">
                    <div class="header" id="keyValueHeader">${questionData.keyValue}</div>
                    <div class="question" id="question">${questionData.question}</div>
                    <div class="input-container" id="inputContainer"></div>
                    <button class="next-btn" id="nextBtn">Go Next</button>
                    <div class="feedback" id="feedback"></div>
                </div>
            `;

            // Create input fields based on answer length
            const inputContainer = document.getElementById('inputContainer');
            inputs = [];
            
            for (let i = 0; i < questionData.answer.length; i++) {
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.className = 'char-input';
                input.dataset.index = i;
                
                input.addEventListener('input', handleInput);
                input.addEventListener('keydown', handleKeydown);
                
                inputContainer.appendChild(input);
                inputs.push(input);
            }
            
            // Focus first input
            setTimeout(() => {
                inputs[0].focus();
            }, 100);
            
            // Attach next button event
            document.getElementById('nextBtn').addEventListener('click', goToNextQuestion);
        }

        function handleInput(e) {
            const input = e.target;
            const index = parseInt(input.dataset.index);
            
            if (input.value) {
                input.classList.add('filled');
                
                // Move to next input
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else {
                    // All inputs filled, check answer
                    checkAnswer();
                }
            }
        }

        function handleKeydown(e) {
            const input = e.target;
            const index = parseInt(input.dataset.index);
            
            // Handle backspace
            if (e.key === 'Backspace' && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        }

        function checkAnswer() {
            const userAnswer = inputs.map(input => input.value.toUpperCase()).join('');
            const correctAnswer = currentQuestionData.answer.toUpperCase();
            
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            
            if (userAnswer === correctAnswer) {
                // Correct answer
                inputs.forEach(input => {
                    input.classList.remove('incorrect');
                    input.classList.add('correct');
                    input.disabled = true;
                });
                
                feedback.textContent = '✓ Correct! Click Next to continue.';
                feedback.className = 'feedback success';
                nextBtn.classList.add('enabled');
            } else if (userAnswer.length === correctAnswer.length) {
                // Wrong answer
                inputs.forEach(input => {
                    input.classList.add('incorrect');
                    input.classList.remove('correct');
                });
                
                feedback.textContent = '✗ Incorrect. Try again!';
                feedback.className = 'feedback error';
                
                // Clear inputs after animation
                setTimeout(() => {
                    inputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('incorrect', 'filled');
                    });
                    inputs[0].focus();
                }, 1000);
            }
        }

        function goToNextQuestion() {
            if (currentQuestionData.nextKey && currentQuestionData.nextAnswer) {
                // Navigate to next question using hash
                window.location.hash = `key=${currentQuestionData.nextKey}&answer=${currentQuestionData.nextAnswer}`;
            } else {
                // Quiz completed
                showCompletionScreen();
            }
        }

        function showCompletionScreen() {
            const container = document.getElementById('mainContainer');
            container.innerHTML = `
                <div class="page-transition">
                    <div class="welcome-title" style="margin-bottom: 30px;">🎉 Congratulations!</div>
                    <div class="question">You've completed all the questions!</div>
                    <button class="start-btn" onclick="restartGame()" style="margin-top: 40px;">Play Again</button>
                </div>
            `;
        }

        function restartGame() {
            window.location.hash = '';
        }

        // Initialize app
        function initApp() {
            const { key, answer } = getHashParams();
            
            // No parameters - show welcome screen
            if (!key && !answer) {
                showWelcomeScreen();
                return;
            }
            
            // Check if key-answer combination exists
            const questionKey = `${key}-${answer}`.toUpperCase();
            const questionData = quizData[questionKey];
            
            if (questionData) {
                // Valid key-answer combination - load question
                loadQuestion(questionData);
            } else {
                // Invalid combination - show access denied
                showAccessDenied();
            }
        }

        // Listen for hash changes
        window.addEventListener('hashchange', initApp);

        // Start the app
        initApp();
    </script>
</body>
</html>
